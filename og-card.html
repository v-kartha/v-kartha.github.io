<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px;
    font-family:'Plus Jakarta Sans', sans-serif;
    background:#0f172a;
    background-image:
      radial-gradient(circle at 0% 0%, rgba(99,102,241,0.35), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(244,63,94,0.28), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(15,157,120,0.15), transparent 50%),
      #0f172a;
    color:white;
    padding:70px 80px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
  }
  .top { display:flex; align-items:center; gap:16px; }
  .mark {
    width:56px; height:56px;
    border-radius:14px;
    background:linear-gradient(135deg,#6366F1 0%,#F43F5E 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:700; font-size:32px;
  }
  .brand { font-size:22px; font-weight:600; letter-spacing:-0.01em; }
  .brand-sub { font-family:'JetBrains Mono', monospace; font-size:13px; color:rgba(255,255,255,0.55); margin-top:2px; letter-spacing:0.04em; }
  .middle { flex:1; display:flex; flex-direction:column; justify-content:center; }
  h1 {
    font-family:'Bricolage Grotesque', sans-serif;
    font-size:88px;
    font-weight:700;
    line-height:1.02;
    letter-spacing:-0.035em;
    margin-bottom:24px;
  }
  .grad {
    background:linear-gradient(120deg,#818cf8 0%,#f472b6 60%,#fb923c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .tag {
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:12px 22px;
    background:rgba(34,197,94,0.15);
    border:1px solid rgba(34,197,94,0.4);
    border-radius:100px;
    font-size:18px;
    color:#86efac;
    font-weight:500;
    align-self:flex-start;
  }
  .tag-dot { width:10px; height:10px; border-radius:50%; background:#22c55e; }
  .bottom {
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:32px;
  }
  .stats { display:flex; gap:48px; }
  .stat-n {
    font-family:'Bricolage Grotesque', sans-serif;
    font-size:44px; font-weight:700; line-height:1;
    letter-spacing:-0.02em;
    background:linear-gradient(120deg,#818cf8,#f472b6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .stat-l {
    font-size:14px;
    color:rgba(255,255,255,0.6);
    margin-top:6px;
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .url {
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:rgba(255,255,255,0.5);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="mark">V</div>
    <div>
      <div class="brand">Vivek Kartha</div>
      <div class="brand-sub">SENIOR DATA ANALYST · ANALYTICS ENGINEER</div>
    </div>
  </div>
  <div class="middle">
    <h1>Building <span class="grad">data systems</span><br/>that scale.</h1>
    <div class="tag"><span class="tag-dot"></span>Available for UK roles · Graduate Visa Sep 2026</div>
  </div>
  <div class="bottom">
    <div class="stats">
      <div>
        <div class="stat-n">650K+</div>
        <div class="stat-l">Users scaled</div>
      </div>
      <div>
        <div class="stat-n">+60%</div>
        <div class="stat-l">Engagement uplift</div>
      </div>
      <div>
        <div class="stat-n">10yrs</div>
        <div class="stat-l">Analytics</div>
      </div>
      <div>
        <div class="stat-n">MSc</div>
        <div class="stat-l">CS · Aberystwyth</div>
      </div>
    </div>
    <div class="url">vivekkartha.com</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<!-- Source for og-image.png (1200×630). Render with a headless browser and screenshot. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: "IBM Plex Sans", Arial, sans-serif; background: #ffffff; color: #0B2545;
         display: flex; flex-direction: column; justify-content: space-between; padding: 72px 80px; border-left: 18px solid #0B2545; }
  .top { display: flex; align-items: center; gap: 28px; }
  .top img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 1px solid #e2e8f0; }
  .name { font-size: 30px; font-weight: 600; }
  .site { font-size: 22px; color: #64748b; margin-top: 4px; }
  h1 { font-size: 68px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .sub { font-size: 28px; color: #334155; margin-top: 18px; }
  .bottom { display: flex; gap: 44px; font-size: 22px; color: #334155; border-top: 1px solid #e2e8f0; padding-top: 28px; }
  .bottom b { color: #0B2545; }
</style>
</head>
<body>
  <div class="top">
    <img src="profile.jpeg" alt="" />
    <div><div class="name">Vivek Kartha</div><div class="site">vivekkartha.com</div></div>
  </div>
  <div>
    <h1>Analytics &amp; Machine Learning Engineer</h1>
    <p class="sub">10+ years in data, product and engineering · MSc Computer Science</p>
  </div>
  <div class="bottom">
    <span><b>Python</b> · SQL · dbt · BigQuery</span>
    <span><b>UK</b> · available for full-time roles</span>
  </div>
</body>
</html>
